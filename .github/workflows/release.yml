name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create release PR or GitHub release
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "chore: release"
          commit: "chore: release"
        env:
          # A user token is required because the repository does not allow the
          # workflow-provided GITHUB_TOKEN to create pull requests.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Build release artifact
        if: steps.changesets.outputs.published == 'true'
        run: npm run package
      - name: Attach artifact to GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$(node -p \"require('./package.json').version\")" artifacts/*.zip --clobber
